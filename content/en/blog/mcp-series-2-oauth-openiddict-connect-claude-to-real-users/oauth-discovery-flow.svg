<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="darr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="1000" height="470" fill="#ffffff"/>

  <!-- ══ ACTORS ══ -->
  <rect x="20" y="16" width="170" height="36" rx="18" fill="#dbeafe"/>
  <text x="105" y="39" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Claude</text>

  <rect x="700" y="16" width="280" height="36" rx="18" fill="#ccfbf1"/>
  <text x="840" y="39" text-anchor="middle" font-size="13" font-weight="bold" fill="#134e4a">MCP Server / Identity Server</text>

  <!-- Lifelines -->
  <line x1="105" y1="52" x2="105" y2="440" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="840" y1="52" x2="840" y2="440" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="5 5"/>

  <!-- ══ 1 — UNAUTHENTICATED CALL ══ -->
  <rect x="20" y="66" width="960" height="52" rx="12" fill="#eff6ff"/>
  <circle cx="44" cy="92" r="11" fill="#2563eb"/>
  <text x="44" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">1</text>
  <text x="64" y="86" font-size="11.5" font-weight="bold" fill="#1e3a8a">UNAUTHENTICATED CALL</text>
  <text x="64" y="103" font-size="10.5" fill="#334155">Claude calls <tspan font-family="Consolas, monospace">/mcp</tspan> without a token → server returns <tspan font-family="Consolas, monospace">401</tspan></text>
  <line x1="105" y1="110" x2="836" y2="110" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#darr-blue)"/>

  <!-- ══ 2 — PROTECTED RESOURCE METADATA ══ -->
  <rect x="20" y="130" width="960" height="52" rx="12" fill="#eff6ff"/>
  <circle cx="44" cy="156" r="11" fill="#2563eb"/>
  <text x="44" y="160" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">2</text>
  <text x="64" y="150" font-size="11.5" font-weight="bold" fill="#1e3a8a">PROTECTED RESOURCE METADATA</text>
  <text x="64" y="167" font-size="10.5" fill="#334155">Claude reads the <tspan font-family="Consolas, monospace">WWW-Authenticate</tspan> header, then hits <tspan font-family="Consolas, monospace">GET /.well-known/oauth-protected-resource</tspan></text>
  <line x1="105" y1="174" x2="836" y2="174" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#darr-blue)"/>

  <!-- ══ 3 — ENDPOINTS REVEALED ══ -->
  <rect x="20" y="194" width="960" height="52" rx="12" fill="#eff6ff"/>
  <circle cx="44" cy="220" r="11" fill="#2563eb"/>
  <text x="44" y="224" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">3</text>
  <text x="64" y="214" font-size="11.5" font-weight="bold" fill="#1e3a8a">ENDPOINTS REVEALED</text>
  <text x="64" y="231" font-size="10.5" fill="#334155">Response names the <tspan font-family="Consolas, monospace">authorization_endpoint</tspan>, <tspan font-family="Consolas, monospace">token_endpoint</tspan> — and, critically, the <tspan font-family="Consolas, monospace">registration_endpoint</tspan></text>
  <line x1="836" y1="238" x2="109" y2="238" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#darr-blue)"/>

  <!-- ══ 4 — OIDC CONFIGURATION ══ -->
  <rect x="20" y="258" width="960" height="52" rx="12" fill="#eff6ff"/>
  <circle cx="44" cy="284" r="11" fill="#2563eb"/>
  <text x="44" y="288" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">4</text>
  <text x="64" y="278" font-size="11.5" font-weight="bold" fill="#1e3a8a">OIDC CONFIGURATION</text>
  <text x="64" y="295" font-size="10.5" fill="#334155">Claude hits <tspan font-family="Consolas, monospace">GET /.well-known/openid-configuration</tspan> (and, for some clients, <tspan font-family="Consolas, monospace">/.well-known/oauth-authorization-server</tspan> — RFC 8414) — both mirrored by the MCP server</text>
  <line x1="105" y1="302" x2="836" y2="302" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#darr-blue)"/>

  <!-- ══ 5 — DYNAMIC CLIENT REGISTRATION ══ -->
  <rect x="20" y="322" width="960" height="52" rx="12" fill="#eff6ff"/>
  <circle cx="44" cy="348" r="11" fill="#2563eb"/>
  <text x="44" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">5</text>
  <text x="64" y="342" font-size="11.5" font-weight="bold" fill="#1e3a8a">DYNAMIC CLIENT REGISTRATION</text>
  <text x="64" y="359" font-size="10.5" fill="#334155">Claude registers as a client via <tspan font-family="Consolas, monospace">POST /connect/register</tspan></text>
  <line x1="105" y1="366" x2="836" y2="366" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#darr-blue)"/>

  <!-- ══ 6 — PKCE AUTHORIZATION ══ -->
  <rect x="20" y="386" width="960" height="52" rx="12" fill="#eff6ff"/>
  <circle cx="44" cy="412" r="11" fill="#2563eb"/>
  <text x="44" y="416" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">6</text>
  <text x="64" y="406" font-size="11.5" font-weight="bold" fill="#1e3a8a">PKCE AUTHORIZATION</text>
  <text x="64" y="423" font-size="10.5" fill="#334155">Claude starts the PKCE authorization flow — continued in step 3 of the full flow above</text>
  <line x1="105" y1="430" x2="836" y2="430" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#darr-blue)"/>
</svg>

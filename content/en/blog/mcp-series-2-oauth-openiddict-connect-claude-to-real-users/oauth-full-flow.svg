<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1000" height="660" fill="#ffffff"/>

  <!-- ══ ACTORS ══ -->
  <rect x="20" y="16" width="170" height="36" rx="18" fill="#dbeafe"/>
  <text x="105" y="39" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Claude Code CLI</text>

  <rect x="230" y="16" width="160" height="36" rx="18" fill="#ccfbf1"/>
  <text x="310" y="39" text-anchor="middle" font-size="13" font-weight="bold" fill="#134e4a">MCP Server</text>

  <rect x="430" y="16" width="210" height="36" rx="18" fill="#ffedd5"/>
  <text x="535" y="39" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Identity Server (OpenIddict)</text>

  <rect x="680" y="16" width="170" height="36" rx="18" fill="#dcfce7"/>
  <text x="765" y="39" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Backend API</text>

  <!-- Lifelines -->
  <line x1="105" y1="52" x2="105" y2="570" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="310" y1="52" x2="310" y2="570" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="535" y1="52" x2="535" y2="570" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="765" y1="52" x2="765" y2="570" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="5 5"/>

  <!-- ══ 1 — DISCOVERY ══ -->
  <rect x="20" y="70" width="600" height="46" rx="12" fill="#eff6ff"/>
  <circle cx="44" cy="93" r="11" fill="#2563eb"/>
  <text x="44" y="97" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">1</text>
  <text x="64" y="88" font-size="11.5" font-weight="bold" fill="#1e3a8a">DISCOVERY</text>
  <text x="64" y="105" font-size="10.5" fill="#334155"><tspan font-family="Consolas, monospace">GET /.well-known/oauth-protected-resource</tspan>  →  resource, issuer + endpoints</text>
  <line x1="105" y1="112" x2="306" y2="112" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <!-- ══ 2 — MOCK DCR ══ -->
  <rect x="20" y="132" width="600" height="46" rx="12" fill="#eff6ff"/>
  <circle cx="44" cy="155" r="11" fill="#2563eb"/>
  <text x="44" y="159" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">2</text>
  <text x="64" y="150" font-size="11.5" font-weight="bold" fill="#1e3a8a">MOCK DYNAMIC CLIENT REGISTRATION</text>
  <text x="64" y="167" font-size="10.5" fill="#334155"><tspan font-family="Consolas, monospace">POST /connect/register</tspan>  →  always returns MyApp_Claude — nothing stored</text>
  <line x1="105" y1="174" x2="306" y2="174" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <!-- ══ 3 — AUTHORIZE ══ -->
  <rect x="20" y="194" width="730" height="46" rx="12" fill="#fff7ed"/>
  <circle cx="44" cy="217" r="11" fill="#ea580c"/>
  <text x="44" y="221" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">3</text>
  <text x="64" y="212" font-size="11.5" font-weight="bold" fill="#7c2d12">AUTHORIZE REQUEST  (PKCE)</text>
  <text x="64" y="229" font-size="10.5" fill="#334155"><tspan font-family="Consolas, monospace">GET /connect/authorize?redirect_uri=localhost:39616/callback&amp;code_challenge=…&amp;resource=…/mcp</tspan></text>
  <line x1="105" y1="236" x2="531" y2="236" stroke="#f97316" stroke-width="1.6" marker-end="url(#arr-orange)"/>

  <!-- ══ 4 — BRIDGE ══ -->
  <rect x="430" y="256" width="320" height="56" rx="12" fill="#faf5ff"/>
  <circle cx="454" cy="279" r="11" fill="#9333ea"/>
  <text x="454" y="283" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">4</text>
  <text x="474" y="276" font-size="11.5" font-weight="bold" fill="#581c87">BRIDGE MIDDLEWARE</text>
  <rect x="640" y="266" width="98" height="18" rx="9" fill="#f3e8ff"/>
  <text x="689" y="279" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#9333ea">SERIES 2B</text>
  <text x="474" y="294" font-size="10.5" fill="#334155">saves the random port in a cookie · rewrites</text>
  <text x="474" y="307" font-size="10.5" fill="#334155">redirect_uri → <tspan font-family="Consolas, monospace">/claude-callback-bridge</tspan></text>

  <!-- ══ 5 — USER LOGIN ══ -->
  <rect x="430" y="328" width="320" height="56" rx="12" fill="#fff7ed"/>
  <circle cx="454" cy="351" r="11" fill="#ea580c"/>
  <text x="454" y="355" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">5</text>
  <text x="474" y="348" font-size="11.5" font-weight="bold" fill="#7c2d12">USER LOGS IN</text>
  <text x="474" y="366" font-size="10.5" fill="#334155">credentials entered · OpenIddict issues auth code</text>
  <text x="474" y="379" font-size="10.5" fill="#334155">→ redirect to <tspan font-family="Consolas, monospace">/claude-callback-bridge</tspan></text>

  <line x1="430" y1="356" x2="109" y2="356" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-orange)"/>
  <text x="268" y="349" text-anchor="middle" font-size="10" fill="#c2540a" font-style="italic">bridge forwards → localhost:39616/callback?code=…</text>

  <!-- ══ 6 — TOKEN EXCHANGE ══ -->
  <rect x="20" y="400" width="730" height="46" rx="12" fill="#fff7ed"/>
  <circle cx="44" cy="423" r="11" fill="#ea580c"/>
  <text x="44" y="427" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">6</text>
  <text x="64" y="418" font-size="11.5" font-weight="bold" fill="#7c2d12">TOKEN EXCHANGE</text>
  <text x="64" y="435" font-size="10.5" fill="#334155"><tspan font-family="Consolas, monospace">POST /connect/token</tspan>  (middleware rewrites redirect_uri again)  →  Bearer JWT for the real user</text>
  <line x1="105" y1="442" x2="531" y2="442" stroke="#f97316" stroke-width="1.6" marker-end="url(#arr-orange)"/>

  <!-- ══ 7 — AUTHENTICATED MCP CALL ══ -->
  <rect x="20" y="462" width="600" height="46" rx="12" fill="#f0fdf4"/>
  <circle cx="44" cy="485" r="11" fill="#16a34a"/>
  <text x="44" y="489" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">7</text>
  <text x="64" y="480" font-size="11.5" font-weight="bold" fill="#14532d">AUTHENTICATED MCP CALL</text>
  <text x="64" y="497" font-size="10.5" fill="#334155"><tspan font-family="Consolas, monospace">POST /mcp</tspan> · <tspan font-family="Consolas, monospace">Authorization: Bearer &lt;token&gt;</tspan>  →  tool response</text>
  <line x1="105" y1="504" x2="306" y2="504" stroke="#22c55e" stroke-width="1.6" marker-end="url(#arr-green)"/>

  <!-- ══ 8 — TOKEN FORWARDING ══ -->
  <rect x="20" y="524" width="940" height="46" rx="12" fill="#f0fdf4"/>
  <circle cx="44" cy="547" r="11" fill="#16a34a"/>
  <text x="44" y="551" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">8</text>
  <text x="64" y="542" font-size="11.5" font-weight="bold" fill="#14532d">TOKEN FORWARDING</text>
  <text x="64" y="559" font-size="10.5" fill="#334155">BearerTokenForwardingHandler re-attaches the same JWT  →  tenant-scoped, permission-checked response</text>
  <line x1="310" y1="566" x2="761" y2="566" stroke="#22c55e" stroke-width="1.6" marker-end="url(#arr-green)"/>

  <!-- ══ LEGEND + NOTE ══ -->
  <rect x="20" y="586" width="940" height="54" rx="12" fill="#f8fafc"/>
  <line x1="44" y1="606" x2="86" y2="606" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="94" y="610" font-size="10.5" fill="#475569">Discovery</text>
  <line x1="168" y1="606" x2="210" y2="606" stroke="#f97316" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="218" y="610" font-size="10.5" fill="#475569">Authentication</text>
  <line x1="316" y1="606" x2="358" y2="606" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="366" y="610" font-size="10.5" fill="#475569">Authenticated API calls</text>
  <text x="44" y="630" font-size="10.5" fill="#64748b">Bridge middleware (step 4) is development-only — covered in Series 2B · production uses registered redirect URIs directly · all tokens are JWTs signed by OpenIddict</text>
</svg>

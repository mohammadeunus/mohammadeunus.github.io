{{ define "main" }}
<style>
/* ── Contact page (scoped: .cx, same system as consulting) ── */
.cx {
  --cx-accent: var(--bs-primary, #5d2f86);
  --cx-accent-rgb: var(--bs-primary-rgb, 93, 47, 134);
  --cx-ink: var(--bs-body-color, #1d2d35);
  --cx-muted: #6c757d;
  --cx-card-bg: #fff;
  --cx-card-border: #e9ecef;
  --cx-tint: rgba(var(--cx-accent-rgb), 0.05);
  --cx-tint-border: rgba(var(--cx-accent-rgb), 0.14);
  --cx-shadow: 0 1px 2px rgba(29, 45, 53, 0.04), 0 8px 24px rgba(29, 45, 53, 0.06);
  color: var(--cx-ink);
}
[data-dark-mode] .cx {
  --cx-accent: #8ed6fb;
  --cx-accent-rgb: 142, 214, 251;
  --cx-ink: #dee2e6;
  --cx-muted: #9aa5ae;
  --cx-card-bg: #272c31;
  --cx-card-border: #343a40;
  --cx-tint: rgba(142, 214, 251, 0.06);
  --cx-tint-border: rgba(142, 214, 251, 0.16);
  --cx-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.25);
}

.cx .cx-muted { color: var(--cx-muted); }

/* Hero */
.cx-hero { text-align: center; padding-top: 1.5rem; margin-bottom: 3rem; }
.cx-hero h1 {
  font-size: clamp(1.6rem, 1.2rem + 2vw, 2.4rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 0.75rem;
}
.cx-hero p { max-width: 36rem; margin: 0 auto; }
.cx-avail {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.35rem 0.9rem;
  border-radius: 2rem;
  border: 1px solid var(--cx-tint-border);
  background: var(--cx-tint);
  color: var(--cx-accent);
  margin-bottom: 1.25rem;
}
.cx-avail::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #2fb344;
  box-shadow: 0 0 0 3px rgba(47, 179, 68, 0.2);
}

/* Contact cards */
.cx-contact {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.25rem 1.5rem;
  background: var(--cx-card-bg);
  border: 1px solid var(--cx-card-border);
  border-radius: 0.75rem;
  box-shadow: var(--cx-shadow);
  text-decoration: none;
  color: var(--cx-ink);
}
[data-dark-mode] .cx a.cx-contact { color: var(--cx-ink); }
.cx-contact .cx-contact-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border-radius: 0.6rem;
  background: var(--cx-tint);
  color: var(--cx-accent);
  flex-shrink: 0;
}
.cx-contact .cx-contact-label { font-weight: 600; font-size: 0.92rem; }
.cx-contact .cx-contact-value { font-size: 0.84rem; color: var(--cx-muted); word-break: break-word; }
.cx-contact .cx-contact-arrow {
  margin-left: auto;
  color: var(--cx-muted);
  flex-shrink: 0;
}

/* Note panel */
.cx-note {
  background: var(--cx-tint);
  border: 1px solid var(--cx-tint-border);
  border-radius: 0.75rem;
  padding: 1.25rem 1.5rem;
  font-size: 0.88rem;
  text-align: center;
}
</style>

<div class="cx container-xxl py-5">
  <div class="row justify-content-center">
    <div class="col-16 col-md-12 col-lg-8">

      <!-- Hero -->
      <div class="cx-hero">
        <span class="cx-avail">Available for new projects</span>
        <h1>Get in touch</h1>
        <p class="cx-muted">Have a project in mind or want to discuss consulting? I'm available for ABP/.NET engagements; just reach out.</p>
      </div>

      {{ partial "contact/methods.html" . }}

    </div>
  </div>
</div>
{{ end }}

{{ define "main" }}
<div class="py-5">
  <div class="row justify-content-center">
    <div class="col-lg-9 text-center">
      <h1 class="h3 fw-bold mb-2">{{ .Title }}</h1>
      {{ with .Params.category }}<p class="text-muted small text-uppercase mb-4">{{ . }}</p>{{ end }}
      {{ $img := .Resources.GetMatch (.Params.image) }}
      {{ if $img }}
      <img src="{{ $img.RelPermalink }}" alt="{{ .Title }}" class="img-fluid rounded mb-4" style="max-height:80vh;">
      {{ end }}
      {{ with .Content }}<div class="text-start mx-auto" style="max-width:640px;">{{ . }}</div>{{ end }}
      <a href="/gallery" class="btn btn-outline-secondary mt-3">← Back to gallery</a>
    </div>
  </div>
</div>
{{ end }}
